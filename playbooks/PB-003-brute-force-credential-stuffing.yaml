id: "PB-003"
slug: "brute-force-credential-stuffing"
name: "Perimeter Brute-Force & Credential Stuffing Mitigation"
description: "Inspect high-velocity authentication failures, evaluate origin IP reputation, enact perimeter IP block with L2 approval, invalidate target user session tokens, and trigger password reset."
version: 1
category: "credential_compromise"

triggers:
  alert_rule_ids: ["wazuh-auth-bruteforce", "5501", "5502"]
  incident_category: ["credential_compromise"]
  min_severity: "medium"

parameters:
  source_ip: ""
  target_username: ""
  failed_attempts: 0

steps:
  - id: "step_check_source_ip"
    type: "enrich_indicator"
    name: "Evaluate Attacker IP Reputation & RFC1918 Guard"
    parameters:
      ioc_type: "ip"
      value: "{{ incident.parameters.source_ip }}"
    on_failure: "continue"

  - id: "step_block_perimeter_ip"
    type: "block_perimeter_ip"
    name: "Enforce Perimeter Firewall Drop on Attacker IP"
    require_approval: true
    approval_level: "soc_l2"
    approval_timeout_hours: 24
    action_type: "block_ip_recommendation"
    risk_impact: "low"
    target_indicator: "{{ incident.parameters.source_ip }}"
    parameters:
      ip_address: "{{ incident.parameters.source_ip }}"
      direction: "inbound"
      duration_hours: 72
    on_failure: "abort"

  - id: "step_revoke_sessions"
    type: "revoke_user_sessions"
    name: "Revoke Active User JWT Refresh Families"
    parameters:
      username: "{{ incident.parameters.target_username }}"
    on_failure: "continue"

  - id: "step_reset_password"
    type: "reset_user_password"
    name: "Issue Mandatory User Password Reset Token"
    parameters:
      username: "{{ incident.parameters.target_username }}"
    on_failure: "continue"

  - id: "step_notify"
    type: "send_notification"
    name: "Alert SOC Team of Perimeter Containment"
    parameters:
      channel: "soc-containment"
      message: "Perimeter IP {{ incident.parameters.source_ip }} blocked and sessions revoked for user {{ incident.parameters.target_username }}."
    on_failure: "continue"
