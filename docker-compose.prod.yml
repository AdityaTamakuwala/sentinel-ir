name: sentinel-ir-prod

services:
  postgres:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      SEED_DEMO_DATA: "false"
      COOKIE_SECURE: "true"
      EVIDENCE_STORAGE_DIR: /var/lib/sentinel-ir/evidence
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
    volumes:
      - evidence_prod_data:/var/lib/sentinel-ir/evidence
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh", "api"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      SEED_DEMO_DATA: "false"
      EVIDENCE_STORAGE_DIR: /var/lib/sentinel-ir/evidence
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777
    volumes:
      - evidence_prod_data:/var/lib/sentinel-ir/evidence
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["/app/entrypoint.sh", "worker"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      SEED_DEMO_DATA: "false"
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["/app/entrypoint.sh", "beat"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  postgres_prod_data:
  redis_prod_data:
  evidence_prod_data:

