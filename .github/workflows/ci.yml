name: SENTINEL IR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-quality-and-tests:
    name: Backend Lint, Security & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: sentinel_ir_test
          POSTGRES_USER: sentinel_owner
          POSTGRES_PASSWORD: ci_owner_password_not_for_prod_9281
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_owner -d sentinel_ir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 shared-mime-info postgresql-client
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Provision sentinel_app role in test Postgres
        env:
          PGPASSWORD: ci_owner_password_not_for_prod_9281
        run: |
          psql -h 127.0.0.1 -U sentinel_owner -d sentinel_ir_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h 127.0.0.1 -U sentinel_owner -d sentinel_ir_test -c "CREATE ROLE sentinel_app WITH LOGIN PASSWORD 'ci_app_password_9281' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h 127.0.0.1 -U sentinel_owner -d sentinel_ir_test -c "GRANT CONNECT ON DATABASE sentinel_ir_test TO sentinel_app; GRANT USAGE ON SCHEMA public TO sentinel_app;"
          psql -h 127.0.0.1 -U sentinel_owner -d sentinel_ir_test -c "ALTER DEFAULT PRIVILEGES FOR ROLE sentinel_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sentinel_app; ALTER DEFAULT PRIVILEGES FOR ROLE sentinel_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO sentinel_app;"
      - name: Lint & Typecheck (Ruff + Mypy)
        working-directory: backend
        run: |
          ruff check app tests scripts
          mypy app
      - name: Security Static & Dependency Audit (Bandit + pip-audit)
        working-directory: backend
        run: |
          bandit -r app -ll
          pip-audit
      - name: OpenAPI Client Drift Check
        run: |
          python scripts/generate_openapi_client.py --check
      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          APP_ENV: testing
          SECRET_KEY: ci_test_secret_key_with_sufficient_entropy_0123456789abcdef
          ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          METRICS_BEARER_TOKEN: ci_metrics_token_0123456789abcdef
          MIGRATION_DATABASE_URL: postgresql+asyncpg://sentinel_owner:ci_owner_password_not_for_prod_9281@127.0.0.1:5432/sentinel_ir_test
          DATABASE_URL: postgresql+asyncpg://sentinel_app:ci_app_password_9281@127.0.0.1:5432/sentinel_ir_test
          SYNC_DATABASE_URL: postgresql+psycopg://sentinel_app:ci_app_password_9281@127.0.0.1:5432/sentinel_ir_test
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
        run: |
          alembic upgrade head
          pytest -v --cov=app --cov-report=term-missing

  frontend-quality-and-tests:
    name: Frontend Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint & Typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Run Vitest Unit/Component Tests
        working-directory: frontend
        run: npm test
      - name: Audit Production Dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e-and-container-scan:
    name: Docker Stack E2E (Playwright) & Trivy Scan
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-quality-and-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Generate local CI .env and start stack
        run: |
          python3 scripts/init_dev_env.py
          docker compose up -d --build --wait
      - name: Scan built API image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinel-ir-api:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Playwright Full Workflow E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Tear down stack
        if: always()
        run: docker compose down -v

