[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ir-backend"
version = "1.0.0"
description = "SENTINEL IR — Enterprise Security Incident Response, Investigation & Automation Platform"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg[binary]>=3.2.3,<3.3.0",
    "alembic>=1.14.0,<1.15.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "cryptography>=43.0.3,<45.0.0",
    "redis>=6.1.0,<8.0.0",
    "celery>=5.4.0,<5.5.0",
    "httpx>=0.27.2,<0.29.0",
    "PyYAML>=6.0.2,<7.0.0",
    "weasyprint>=62.3,<64.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-multipart>=0.0.18,<0.1.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "pyotp>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.26.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.7.3,<0.10.0",
    "mypy>=1.13.0,<1.15.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
    "bandit>=1.7.10,<1.9.0",
    "pip-audit>=2.7.3,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "B010", "S101", "S104", "S105", "S106", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

